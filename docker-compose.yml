services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: unwork
      POSTGRES_USER: unwork
      POSTGRES_PASSWORD: unwork
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unwork -d unwork"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
