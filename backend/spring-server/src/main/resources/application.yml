spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/unwork}
    username: ${DB_USERNAME:unwork}
    password: ${DB_PASSWORD:unwork}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
