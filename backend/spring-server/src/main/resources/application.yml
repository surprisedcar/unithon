spring:
  datasource:
    url: ${DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/unwork}}
    username: ${DATABASE_USERNAME:${DB_USERNAME:unwork}}
    password: ${DATABASE_PASSWORD:${DB_PASSWORD:unwork}}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173,http://localhost:5174}
