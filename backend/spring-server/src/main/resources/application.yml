server:
  port: ${BACKEND_PORT:8080}

spring:
  application:
    name: automedi-backend

app:
  cors:
    allowed-origin-patterns: ${FRONTEND_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://10.*:*,http://172.*:*,http://192.168.*:*}
  jwt:
    issuer: automedi-backend
    access-token-seconds: 3600
    secret: ${JWT_SECRET:automedi-local-development-secret-change-me-2026}
